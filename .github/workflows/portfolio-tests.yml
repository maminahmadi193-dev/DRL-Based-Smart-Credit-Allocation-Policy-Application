name: Portfolio RL tests

on:
  push:
    branches:
      - feature/portfolio-rl
  pull_request:
    branches:
      - feature/portfolio-rl
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas scikit-learn gymnasium

      - name: Compile environment modules
        run: python -m compileall -q env

      - name: Run portfolio and reward unit tests
        working-directory: env
        run: |
          python -m unittest test_portfolio_simulator test_portfolio_loan_env test_reward_engine -v

      - name: Smoke-test baseline policy pipeline
        run: |
          python env/evaluate_baseline_policies.py --episodes 1 --applicants-per-month 1 --origination-months 1 --loan-term-months 12 --initial-budget 1000000000 --max-hazard 1000 --default-collection-lag-months 12 --output-dir "$RUNNER_TEMP/portfolio-baseline-smoke"
